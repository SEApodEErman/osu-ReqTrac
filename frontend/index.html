<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the last-used theme before first paint. The authoritative value
      // lives in the app's preferences; this is only a flash-free cache.
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('theme') || 'system';
        } catch {
          // Storage can be unavailable; fall back to the system theme.
        }
        const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = preference === 'system' ? systemTheme : preference;
      })();
    </script>
    <title>osu!ReqTrac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
